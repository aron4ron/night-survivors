name: Rename game file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename game file to index.html
        run: |
          git config user.name "aron4ron"
          git config user.email "aron4ron@users.noreply.github.com"
          mv vuansabaxi-akusiyon.html index.html
          git add -A
          git commit -m "Rename game file to index.html"
          git push
