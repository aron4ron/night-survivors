name: Copy game file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy game file to index.html
        run: |
          cp vuansabaxi-akusiyon.html index.html
          git config user.name "aron4ron"
          git config user.email "aron4ron@users.noreply.github.com"
          git add index.html
          git commit -m "Update index.html to new build" || echo "no changes"
          git push
